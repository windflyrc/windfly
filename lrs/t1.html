<!DOCTYPE html> <!-- HTML5文档类型声明 -->
<html lang="en"> <!-- 根元素，语言设置为英文 -->

<head> <!-- 头部区域开始 -->
    <meta charset="UTF-8"> <!-- 设置页面字符编码为UTF-8 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 设置视口，实现响应式布局 -->
    <title>狼人杀模拟器</title> <!-- 页面标题，显示在浏览器标签页 -->
    <script src="vue.global.js"></script> <!-- 引入Vue.js全局库文件 -->
    <style>
        /* 内部CSS样式表 */

        /* 选择面板样式类 - 用于数字选择面板的样式 */
        .select-panel {
            position: absolute; /* 绝对定位 */
            background-color: rgb(139, 184, 191); /* 蓝绿色背景 */
            border: 1px solid #ccc; /* 灰色边框 */
            padding: 10px; /* 内边距 */
            z-index: 1; /* 层级，确保在其他元素之上 */
        }

        /* 表格样式 */
        table {
            border: 1px; /* 边框宽度 */
            border-collapse: collapse; /* 合并表格边框 */
        }

        /* 表格容器样式 - 用于居中显示表格 */
        .tableContainer {
            display: flex; /* 使用flex布局 */
            align-items: center; /* 垂直居中 */
            justify-content: center /* 水平居中 */
        }

        /* 红色背景样式类 - 用于未上警状态 */
        .sjRed {
            background-color: red;
        }

        /* 黄色背景样式类 - 用于已上警状态 */
        .isYellow {
            background-color: yellow;
        }
    </style>
</head>

<body style="background-color: rgb(168, 173, 176);"> <!-- 页面主体，背景色为灰蓝色 -->
    <div id="app"> <!-- Vue 应用挂载点 -->

    </div> <!-- Vue 挂载点结束 -->
    <script> <!-- JavaScript 脚本开始 -->
        // 定义 Player 类，用于表示玩家对象
        window.Player=class Player {
            constructor(rank) {
                this.rank = rank;
                this.shangjing = false;
                this.cai = [];
                this.zhan = [];
                this.shenfen = [];
            }
        }

        // 创建 Vue 应用实例
        const app = Vue.createApp({
            // 应用模板
            template: `
            <div class="tableContainer">
                <!-- 循环创建2个表格，每个表格显示6个玩家 -->
                <table border="1" v-for="i in 2">
                    <thead>
                        <tr>
                            <!-- 动态生成表头 -->
                            <th v-for="(head,index) in side(i)">{{ head.head }}</th>
                        </tr>
                    </thead>
                    <tbody>
                            <!-- 创建玩家组件，传递位置和表头信息 -->
                            <player v-for="itable in 6" :position="(i-1)*6+itable" :header="side(i)" @playerData="newPlayer"> </player>
                    </tbody>
                </table>
            </div>
            <!-- 预言家组件 -->
            <yuyanjia></yuyanjia>
            <!-- 循环显示每个玩家的状态文本 -->
            <p v-for="i in 12" v-text="textReturn(i)"></p>
            <!-- 数字选择组件 -->
            <grid :gridArray="num" @addBtn="(f) => test = f"></grid>
            <!-- 显示测试数据 -->
            <a>{{test}}</a>

          `
            ,

            // 应用的数据属性
            data() {
                return {
                    // 表头配置数组，用于动态生成表格列
                    headers: [
                        {
                            "head": "身份", // 列标题
                            "index": 1, // 索引
                            "tag": "shenfen" // 对应数据属性名
                        }, {
                            "head": "站",
                            "index": 2,
                            "tag": "zhan"
                        }, {
                            "head": "踩",
                            "index": 3,
                            "tag": "cai"
                        }, {
                            "head": "警",
                            "index": 4,
                            "tag": "shangjing"
                        }, {
                            "head": "号",
                            "index": 5,
                            "tag": "rank"
                        }
                    ],
                    test: 0, // 测试变量，用于调试
                    num: [], // 存储选中的数字数组
                    shangjing: false, // 上警状态
                    player: Array(12).fill().map((_, index) => new Player(index + 1)), // 初始化12个玩家对象
                    text: "" // 文本变量
                }
            },
            // 应用的方法集合
            methods: {
                // 更新数字数组的方法
                update(f) {
                    this.num = f
                },
                // 更新上警状态的方法
                updatesj(f) {
                    this.shangjing = f
                },
                // 新增玩家数据的方法 - 接收玩家对象并更新玩家数组
                newPlayer(p) {
                    if (this.player.length > 5) {
                        // 如果玩家数组已初始化，更新对应位置的玩家
                        this.player[p.rank - 1] = p
                    } else {
                        // 否则添加新玩家
                        this.player.push(p)
                    }
                    console.log(this.player) // 在控制台输出玩家数组
                },
                // 空的 update 方法
                update() {

                },
                // 根据表格索引返回表头配置
                side(i) {
                    if (i == 2) {
                        // 第二个表格（右侧）返回反转后的表头
                        return [...this.headers].reverse();
                    }
                    return this.headers; // 第一个表格返回原始表头
                },
                // 返回玩家状态文本
                textReturn(i) {
                    // 拼接玩家状态信息：编号、上警状态、身份、站队、踩队
                    return this.player[i - 1].rank + "号玩家在警" + (this.player[i - 1].shangjing ? "上" : "下") + "，身份为：" + this.player[i - 1].shenfen + "，站队为：" + this.player[i - 1].zhan + "，踩队为：" + this.player[i - 1].cai;
                }
            },

        });
        // 定义 grid 组件 - 数字选择面板
        app.component('grid', {
            props: ['gridArray','show'], // 接收的属性：数字数组、显示标志
            emits: ['addBtn','closePanel'], // 发出的事件：添加按钮、关闭面板

            template: `
            <!-- 条件渲染选择面板 -->
            <div v-if="show" class="select-panel">
                <div>
                    <!-- 循环创建4行，每行3个数字按钮 -->
                    <div v-for="i in 4" :key="i">
                        <!-- 创建数字按钮，已包含的数字会禁用 -->
                        <button :disabled="gridArr().includes((i-1)*3+j)"
                            v-for="j in 3"
                            @click="addBtn((i-1)*3+j)"
                            style= "width: 25px;height: 25px;align-items: center">{{ (i-1)*3+j }}
                        </button>
                    </div>
                </div>
                <!-- 关闭面板按钮 -->
                <button @click="$emit('closePanel')">close</button>
            </div>
            `,

            data() { // 组件数据，无额外数据
                return {

                }
            },

            methods: { // 组件方法
                // 添加按钮事件，发出 addBtn 事件并传递选中的数字
                addBtn(btn) {
                    this.$emit('addBtn', btn)
                },
                // 检查 gridArray 是否为数组，返回有效的数字数组
                gridArr() {
                    if (Array.isArray(this.gridArray)) {
                        return this.gridArray
                    }
                    return []
                }
            }
        })

        // 定义选择器组件 - 用于选择玩家编号的组件
        app.component('selecter', {
            emits: ['go'], // 发出的事件：go
            props: ["playerArr"], // 接收的属性：已选玩家数组

            template: `
                <div>
                    <!-- 显示选择面板的按钮 -->
                    <button @click="dis=true">+</button>

                    <!-- 数字选择面板组件 -->
                    <grid :gridArray="playerArr" :show="dis" @closePanel="dis=false" @addBtn="(f) => {add(f);emit()}"></grid>

                    <!-- 显示已选中的按钮，点击可删除 -->
                    <button v-for="btn in sortedButtons"
                            :key="btn"
                            @click="buttons = buttons.filter(item => item !== btn);emit()">{{ btn }}</button>
                </div>`,

            data() { // 组件数据
                return {
                    dis: false, // 控制选择面板的显示/隐藏
                    buttons: [] // 存储已选中的按钮
                }
            },
            computed: { // 计算属性
                // 返回排序后的按钮数组
                sortedButtons() {
                    return this.buttons.sort((a, b) => a - b)
                }
            },
            methods: { // 组件方法
                // 添加按钮到选中数组
                add(btn) {
                    this.buttons.push(btn)
                },
                // 发出 go 事件并传递排序后的按钮数组
                emit() {
                    this.$emit('go', this.sortedButtons)
                }
            },
        });

        // 定义上警组件 - 用于表示玩家是否上警
        app.component('shangjing', {
            emits: ['shangjing'], // 发出的事件：shangjing

            template: `
                <div>
                    <!-- 上警/下警按钮 -->
                    <button @click="add" :class="sjClass">{{ sjStedas }}</button>
                </div>
            `,

            data() { // 组件数据
                return {
                    shangjing: false, // 上警状态
                    sjStedas: "下", // 按钮显示文本
                    sjClass: "sjRed" // 按钮样式类
                }
            },

            methods: { // 组件方法
                // 切换上警状态
                add() {
                    this.sjClass = this.shangjing ? "sjRed" : "isYellow"; // 切换样式
                    this.sjStedas = this.shangjing ? "下" : "上" // 切换显示文本
                    this.shangjing = !this.shangjing // 切换状态
                    this.$emit('shangjing', this.shangjing) // 发出上警状态事件
                }
            },
        });

        // 定义玩家组件 - 用于表示每个玩家的座位
        app.component('player', {
            props: ['position', 'header'], // 接收的属性：位置、表头配置
            emits: ['playerData'], // 发出的事件：playerData

            template: `
            <tr>
                <!-- 循环创建单元格 -->
                <td v-for="(i,index) in side " :key="i" >
                    <!-- 动态组件渲染：如果是组件类型则渲染组件 -->
                    <component v-if="isComponent(i)" :is="i" :playerArr=playerCaiZhan() @shangjing="shangjing" @go="(f) => seleter(f, index)"></component>
                    <!-- 否则显示文本内容 -->
                    <template v-else>{{ i }}</template>
                </td>

            </tr>`,

            data() { // 组件数据
                p = new Player(this.position) // 创建玩家对象
                return {
                    p, // 玩家对象
                    cell: [ // 单元格配置数组
                        "身份",
                        "selecter",
                        "selecter",
                        "shangjing",
                        p.rank,
                    ],
                    number: false,
                }
            },

            methods: { // 组件方法
                // 判断是否是组件类型
                isComponent(name) {
                    return name === "selecter" || name === "shangjing"
                },
                // 处理上警状态变化
                shangjing(f) {
                    this.p.shangjing = f;
                    this.uploadData()
                },
                // 处理选择器选择的玩家
                seleter(f, i) {
                    this.p[this.header[i].tag] = f
                    this.uploadData()
                },
                // 上传玩家数据
                uploadData() {
                    this.$emit('playerData', this.p)
                },
                // 获取玩家的踩和站的玩家数组
                playerCaiZhan() {
                    return [...this.p.zhan, ...this.p.cai];
                }
            },

            computed: { // 计算属性
                // 根据位置判断表格的方向（左侧或右侧）
                side() {
                    if (this.position > 6) {
                        return [...this.cell].reverse(); // 右侧表格反转
                    }
                    return this.cell; // 左侧表格保持原样
                }
            },

            mounted() { // 组件挂载生命周期钩子
                this.uploadData()
            }
        });

        // 定义预言家组件 - 用于处理预言家相关操作
        app.component('yuyanjia', {

            template: `
                <div>
                    <!-- 添加预言家按钮 -->
                    <button @click="show=true">添加预言家</button>

                    <!-- 选择预言家编号的组件 -->
                    <grid :show="show" @closePanel="show=false" @addBtn="(f)=>{addYyj(f);show=false;yuyanjiaNum++}"></grid>

                    <!-- 预言家信息表格 -->
                    <table border="1">
                        <thead>
                            <tr>
                                <th>预言家</th>
                                <th>查杀</th>
                                <th>金水</th>
                                <th>狼坑</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- 循环创建预言家行 -->
                            <tr v-for="i in yuyanjiaNum">
                                <td>{{yuyanjia[i-1].rank}}</td> <!-- 预言家编号 -->
                                <td><selecter :playerArr="[]"></selecter></td> <!-- 查杀玩家选择 -->
                                <td><selecter :playerArr="[]"></selecter></td> <!-- 金水玩家选择 -->
                                <td><selecter :playerArr="[]"></selecter></td> <!-- 狼坑玩家选择 -->
                            </tr>
                        </tbody>
                    </table>

                    <!-- 调试信息：显示预言家数组 -->
                    {{yuyanjia}}
                </div>
                `,

            data() { // 组件数据
                return {
                    show: false, // 控制选择面板显示/隐藏
                    yuyanjia:[], // 预言家数组
                    yuyanjiaNum:0 // 预言家数量
                }
            },

            methods: { // 组件方法
                // 添加预言家到数组
                addYyj(yyj) {
                    this.yuyanjia.push(new Player(yyj))
                }
            }
        })

        // 挂载 Vue 应用到指定元素
        app.mount('#app');
    </script>
</body>

</html>
